[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aw-app-playwright-record"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "playwright>=1.40"]

[project.scripts]
playwright-record-app = "playwright_record_app.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
